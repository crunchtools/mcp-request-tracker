[project]
name = "mcp-request-tracker-crunchtools"
version = "0.4.0"
description = "Secure MCP server for Request Tracker (RT) ticket management"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["mcp", "request-tracker", "rt", "tickets", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-request-tracker-crunchtools = "mcp_request_tracker_crunchtools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_request_tracker_crunchtools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = [
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "PLC0415", "PLR2004"]
# PLR0913/PLR0917: 2 hits each, the MCP tool wrapper (server.py) and its
# implementation (tools/tickets.py) for create_ticket, which legitimately
# takes several independent optional fields.
"src/mcp_request_tracker_crunchtools/server.py" = ["TRY300", "PLR0913", "PLR0917"]
"src/mcp_request_tracker_crunchtools/tools/tickets.py" = ["TRY300", "PLR0913", "PLR0917", "PLW0603"]
# TRY003: 3 hits, all in config.py's own required-env-var ConfigurationError
# messages.
"src/mcp_request_tracker_crunchtools/config.py" = ["TRY003", "PLW0603"]
# PLR2004: 7 hits, HTTP status codes in client.py's error dispatch.
"src/mcp_request_tracker_crunchtools/client.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
